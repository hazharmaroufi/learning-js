<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آکاردئون</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="accordion">
    <div class="item">
      <button class="question">
        <span> هزینه طراحی سایت چقدر است؟ </span>
        <span class="icon">+</span>
      </button>
      <div class="answer ">
        <p>جواب سوال اینجا قرار میگیرد.</p>
      </div>
    </div>
    <div class="item">
      <button class="question">
        <span> کار سئو هم انجام میدید؟</span>
        <span class="icon">+</span>
      </button>
      <div class="answer">
        <p>جواب سوال اینجا قرار میگیرد.</p>
      </div>
    </div>
    <div class="item">
      <button class="question">
        <span> طراحی سایت چقدر طول میکشه؟ </span>
        <span class="icon">+</span>
      </button>
      <div class="answer">
        <p>جواب سوال اینجا قرار میگیرد.</p>
      </div>
    </div>
    <div class="item">
      <button class="question">
        <span> دامنه و هاست به اسم چه کسی خواهد بود؟ </span>
        <span class="icon">+</span>
      </button>
      <div class="answer">
        <p>جواب سوال اینجا قرار میگیرد.</p>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
